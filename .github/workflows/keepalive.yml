name: Keep Repository Alive

on:
  workflow_dispatch:

  schedule:
    # Chạy lúc 11:17 ngày 1 hàng tháng theo giờ Việt Nam
    # GitHub cron dùng UTC: 04:17 UTC = 11:17 VN
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Add current date and time
        env:
          TZ: Asia/Ho_Chi_Minh
        run: |
          echo "Keep alive: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> .github/KEEPALIVE.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/KEEPALIVE.md
          git commit -m "chore: monthly keepalive $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d')"
          git push
